name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a -mavericks.(N+1) repackage of the current upstream"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop"
        type: boolean
        default: false

permissions:
  contents: read

# spec: shipyard SKILL.md "Release workflow" -- a run that can publish is alone in its group
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ver:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.full }}
      publish: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - id: ver
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LOCAL_RELEASE: ${{ inputs.local_release }}
          RECONCILE: ${{ inputs.reconcile }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          effective_local_release="$LOCAL_RELEASE"
          [ "$RECONCILE" = true ] && effective_local_release=true
          mode="$(LOCAL_RELEASE="$effective_local_release" sh "$SHIPYARD_SCRIPTS/release-mode.sh")"
          out="$(sh build/version.sh "$mode")"
          full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
          [ -n "$full" ] || { echo "::error::version.sh gave no FULL= line: $out"; exit 1; }
          [ "$GITHUB_REF_NAME" = main ] || rel=no
          # spec: shipyard SKILL.md "A release is a declared state, not an event" -- a reconcile
          #       dispatch cuts N+1, so it publishes only while no release carries this tree's state;
          #       a human local_release=true dispatch stays ungated, since choosing it is the decision
          if [ "$rel" = yes ] && [ "$RECONCILE" = true ]; then
            digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
            answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$full")"
            echo "reconcile: release-needed.sh says $answer"
            case "$answer" in
              PUBLISH) : ;;
              *) rel=no ;;
            esac
          fi
          { echo "full=$full"; echo "release=$rel"; } >> "$GITHUB_OUTPUT"
          echo "version=$full publish=$rel"

  build-cross:
    needs: ver
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Build out of tree
        run: echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
      - name: Pin the version the ver job resolved
        run: printf '%s\n' "${{ needs.ver.outputs.version }}" > VERSION
      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record
      - name: Build the arm64 host zig (zig-cross)
        run: |
          set -eu
          stage="$(sh build/build-host-zig.sh)"
          echo "CROSS_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Compat matrix, built afresh for the 10.9 guest, with the pinned 10.9 SDK beside the stage as Longboat's sdk109
        run: |
          set -eu
          sdk109="$(dirname "$CROSS_STAGE")/sdk109/SDKs"
          rm -rf "$sdk109"; mkdir -p "$sdk109"
          ln -s "$(sh "$SHIPYARD_SCRIPTS/fetch_sdk.sh" --arch x86_64)" "$sdk109/MacOSX10.9.sdk"
          OUT="$RUNNER_TEMP/compat-matrix"
          rm -rf "$OUT"
          sh tests/compat-matrix.sh "$CROSS_STAGE/bin/zig" "$OUT"
          COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/compat-matrix.tar" -C "$OUT" .
      - name: Tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"
      - name: Pack the stage, executable bits and links intact
        run: COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/stage-cross.tar" -C "$CROSS_STAGE" .
      - uses: actions/upload-artifact@v7
        with: { name: stage-cross, path: "${{ runner.temp }}/stage-cross.tar" }
      - uses: actions/upload-artifact@v7
        with: { name: compat-matrix, path: "${{ runner.temp }}/compat-matrix.tar" }
      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

  build-native:
    needs: [ver, build-cross]
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Build out of tree
        run: echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
      - name: Pin the version the ver job resolved
        run: printf '%s\n' "${{ needs.ver.outputs.version }}" > VERSION
      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record
      - uses: actions/download-artifact@v8
        with: { name: stage-cross, path: "${{ runner.temp }}/in" }
      - name: Unpack build-cross's zig as the host zig
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/host-zig"
          tar -xf "$RUNNER_TEMP/in/stage-cross.tar" -C "$RUNNER_TEMP/host-zig"
          echo "HOST_ZIG=$RUNNER_TEMP/host-zig/bin/zig" >> "$GITHUB_ENV"
      - name: Build the x86_64 Mac OS X 10.9 zig with it
        run: |
          set -eu
          stage="$(sh build/build-native.sh)"
          COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/stage-native.tar" -C "$stage" .
      - uses: actions/upload-artifact@v7
        with: { name: stage-native, path: "${{ runner.temp }}/stage-native.tar" }
      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

  collect:
    needs: [ver, build-cross, build-native]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Build out of tree
        run: echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
      - name: Pin the version the ver job resolved
        run: printf '%s\n' "${{ needs.ver.outputs.version }}" > VERSION
      - name: Record the pre-package tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record
      - uses: actions/download-artifact@v8
        with: { pattern: stage-*, merge-multiple: true, path: "${{ runner.temp }}/in" }
      - name: Put both stages where packaging looks for them
        run: |
          set -eu
          REPO_ROOT="$PWD"; . build/versions.sh
          for s in "cross $CROSS_STAGE_ROOT$CROSS_PREFIX" "native $NATIVE_STAGE_ROOT$NATIVE_PREFIX"; do
            v="${s%% *}"; d="${s#* }"
            rm -rf "$d"; mkdir -p "$d"
            tar -xf "$RUNNER_TEMP/in/stage-$v.tar" -C "$d"
          done
      - name: Package both
        run: |
          set -eu
          sh build/package-native-pkg.sh
          sh build/package-cross-pkg.sh
      - name: Tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"
      - name: Ingredient pins are well declared
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"
      - name: Release notes
        run: |
          set -eu
          V="${{ needs.ver.outputs.version }}"
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$V" --version "$V" \
            --product Zig --min-os 10.9.5 --out dist/RELEASE_NOTES.md
      - name: Record the declared state in the notes
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file dist/RELEASE_NOTES.md --digest "$digest"
      - name: Sign both pkgs and write their feeds
        if: needs.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY is not visible to this repo"; exit 1; }
          V="${{ needs.ver.outputs.version }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$V"
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" --product zig --feed-dir dist \
            --channel-title "Zig for Mavericks" --version "$V" --pkg-url "$base/zig-$V.pkg" \
            --notes-file dist/RELEASE_NOTES.md --pkg "dist/zig-$V.pkg" --min-os 10.9.5
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" --product zig-cross --feed-dir dist \
            --channel-title "Zig for Mavericks (cross)" --version "$V" --pkg-url "$base/zig-cross-$V.pkg" \
            --notes-file dist/RELEASE_NOTES.md --pkg "dist/zig-cross-$V.pkg" --min-os 11.0
      - name: Unsigned stand-in feeds (never published)
        if: needs.ver.outputs.publish != 'yes'
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" dist "${{ needs.ver.outputs.version }}"
      - name: Artifact conformance
        run: |
          set -eu
          facts="$(sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "${{ needs.ver.outputs.version }}")"
          printf '%s\n' "$facts" | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"
      - name: Each feed is an upgrade on its line
        if: needs.ver.outputs.publish == 'yes'
        run: |
          set -eu
          for f in zig zig-cross; do
            sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "dist/$f.xml" \
              --version "${{ needs.ver.outputs.version }}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: mavergreen-zig
          path: |
            dist/*.pkg
            dist/build-info-*.txt
            dist/RELEASE_NOTES.md
            dist/*.xml
      - name: Packaging must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

  modern-smoke:
    needs: [ver, collect]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Pin the version the ver job resolved
        run: printf '%s\n' "${{ needs.ver.outputs.version }}" > VERSION
      - uses: actions/download-artifact@v8
        with: { name: mavergreen-zig, path: dist }
      - name: Install the pinned Longboat and the sdk109 that zig-cross requires
        run: |
          set -eu
          lb="$(tr -d '[:space:]' < components/longboat/version)"
          p="$(sh "$SHIPYARD_SCRIPTS/fetch-release-pkg.sh" longboat "$lb" "longboat-$lb.pkg" "$RUNNER_TEMP/deps")"
          sudo installer -pkg "$p" -target /
          sudo /usr/local/mavergreen/longboat/bin/longboat sdk install 10.9
      - name: Install the run's own zig-cross pkg
        env:
          ZIG_FULL_VERSION: ${{ needs.ver.outputs.version }}
        run: sudo installer -pkg "dist/zig-cross-$ZIG_FULL_VERSION.pkg" -target /
      - name: Run the installed arm64 zig-cross (77, a skip, is a failure here)
        env:
          ZIG_FULL_VERSION: ${{ needs.ver.outputs.version }}
        run: |
          s=0; SMOKE_NO_SKIP=1 sh tests/smoke-cross.sh "$ZIG_FULL_VERSION" || s=$?
          [ "$s" -eq 0 ] || { echo "::error::tests/smoke-cross.sh exited $s (77, a skip, is a failure here)"; exit 1; }

  on-mavericks:
    needs: [ver, build-cross, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: mavergreen-zig, path: dist }
      - uses: actions/download-artifact@v8
        with: { name: compat-matrix, path: . }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Bring shipyard's scripts, VERSION and the pinned Longboat, clang-22 and ca-certs into the workspace the guest gets
        env:
          ZIG_FULL_VERSION: ${{ needs.ver.outputs.version }}
        run: |
          set -eu
          cp -R "$SHIPYARD_SCRIPTS" .shipyard-scripts
          printf '%s\n' "$ZIG_FULL_VERSION" > VERSION
          lb="$(tr -d '[:space:]' < components/longboat/version)"
          sh "$SHIPYARD_SCRIPTS/fetch-release-pkg.sh" longboat "$lb" "longboat-$lb.pkg" deps
          cl="$(tr -d '[:space:]' < components/clang/version)"
          sh "$SHIPYARD_SCRIPTS/fetch-release-pkg.sh" clang-22 "$cl" "mavericks-clang-22-native-$cl.pkg" deps
          ca="$(tr -d '[:space:]' < components/ca-certs/version)"
          sh "$SHIPYARD_SCRIPTS/fetch-release-pkg.sh" ca-certs "$ca" "ca-certs-$ca.pkg" deps
          ls dist deps
      - name: Install zig on Mac OS X 10.9, smoke it, and run every compat-matrix program there
        uses: Mavergreen/mavericks-vm@v1
        env:
          ZIG_FULL_VERSION: ${{ needs.ver.outputs.version }}
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          cpu: '4'
          mem: '8192'
          envs: ZIG_FULL_VERSION
          copyback: false
          run: |
            sw_vers
            sudo -n true || { echo "the guest's user cannot sudo without a password, and installer needs root"; exit 1; }
            for p in deps/longboat-*.pkg; do sudo installer -pkg "$p" -target / || exit 1; done
            sudo /usr/local/mavergreen/longboat/bin/longboat sdk install 10.9 || exit 1
            sudo installer -pkg "deps/mavericks-clang-22-native-$(tr -d '[:space:]' < components/clang/version).pkg" -target / || exit 1
            sudo installer -pkg "dist/zig-$ZIG_FULL_VERSION.pkg" -target / || exit 1
            export SHIPYARD_SCRIPTS="$PWD/.shipyard-scripts"
            s=0; ZIG_SMOKE_CA_CERTS=absent SMOKE_NO_SKIP=1 sh tests/smoke-native.sh "$ZIG_FULL_VERSION" || s=$?
            [ "$s" -eq 0 ] || { echo "tests/smoke-native.sh exited $s (77, a skip, is a failure here)"; exit 1; }
            sudo installer -pkg "deps/ca-certs-$(tr -d '[:space:]' < components/ca-certs/version).pkg" -target / || exit 1
            s=0; ZIG_SMOKE_CA_CERTS=present SMOKE_NO_SKIP=1 sh tests/smoke-native.sh "$ZIG_FULL_VERSION" manifest_version fetch_project || s=$?
            [ "$s" -eq 0 ] || { echo "tests/smoke-native.sh with ca-certs exited $s (77, a skip, is a failure here)"; exit 1; }
            rm -rf compat-matrix && mkdir compat-matrix && tar -xf compat-matrix.tar -C compat-matrix || exit 1
            limit=120; ran=0; failed=0
            for b in "$PWD"/compat-matrix/*; do
              [ -f "$b" ] || continue
              n="$(basename "$b")"; ran=$((ran + 1))
              scratch="$(mktemp -d /tmp/compat-matrix.XXXXXX)"
              s=0; (cd "$scratch" && perl -e '$t = shift; alarm $t; exec @ARGV or die "exec $ARGV[0]: $!\n"' "$limit" "$b") || s=$?
              rm -rf "$scratch"
              case "$s" in
                0) echo "ok $n" ;;
                142) echo "FAIL $n: still running after ${limit}s, ended by SIGALRM"; failed=$((failed + 1)) ;;
                *) echo "FAIL $n: exited $s"; failed=$((failed + 1)) ;;
              esac
            done
            [ "$ran" -gt 0 ] || { echo "FAIL: compat-matrix.tar held no programs"; exit 1; }
            [ "$failed" -eq 0 ] || { echo "FAIL: $failed of $ran compat-matrix programs failed on Mac OS X 10.9"; exit 1; }
            s=0; ZIG=/usr/local/mavergreen/zig/bin/zig sh .shipyard-scripts/run-repo-tests.sh || s=$?
            [ "$s" -eq 0 ] || { echo "the repo's tests failed on Mac OS X 10.9 with the installed zig (exit $s)"; exit 1; }

  scan:
    needs: [ver, collect]
    if: always() && needs.ver.outputs.publish == 'yes'
    permissions: { actions: read, contents: read }
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with: { artifact: mavergreen-zig }
    secrets: { SPARKLE_PRIVATE_KEY: "${{ secrets.SPARKLE_PRIVATE_KEY }}" }

  publish:
    needs: [ver, collect, scan, on-mavericks, modern-smoke]
    if: needs.ver.outputs.publish == 'yes'
    permissions: { contents: write }
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with: { version: "${{ needs.ver.outputs.version }}", artifact: mavergreen-zig }

  retry:
    needs: [ver, publish]
    if: always() && needs.publish.result == 'failure'
    permissions: { contents: read, actions: write }
    uses: Mavergreen/shipyard/.github/workflows/retry-release.yml@v1
    with: { version: "${{ needs.ver.outputs.version }}" }

  required:
    name: required (release)
    if: always()
    needs: [ver, build-cross, build-native, collect, modern-smoke, on-mavericks, scan, publish, retry]
    runs-on: ubuntu-latest
    steps:
      - uses: Mavergreen/shipyard/.github/actions/required-gate@v1
        with: { needs: "${{ toJSON(needs) }}" }
